name: CI

on:
  push:
    branches: master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "0.15.16"
          spago: latest
          purs-tidy: "0.11.1"

      - name: Cache PureScript dependencies
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-spago-${{ hashFiles('**/spago.yaml', 'spago.lock') }}
          path: |
            .spago
            output

      - run: npm install

      - run: npm run -s build

      - run: npm run -s test

      - run: npm run -s example-all

      - run: npm run -s check-formatting
